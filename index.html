:root{--outl:#2a160a;--woodhi:#c08a4e;--ink:#4a2c12;--gold:#ffd24a;--red:#c8323c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#16466e 0%,#0b2a4a 45%,#061629 100%);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.05;display:flex;flex-direction:column;min-height:100vh}
.h{font-family:"PIX",ui-monospace,monospace;font-weight:normal}
.wood{background:repeating-linear-gradient(0deg,#8a5527 0 7px,#7d4b22 7px 8px);border:3px solid var(--outl);box-shadow:inset 0 0 0 2px var(--woodhi),inset 0 -4px 0 2px #5c3416,0 3px 0 rgba(0,0,0,.45);border-radius:6px;color:#fff1d6}
.parch{background:radial-gradient(ellipse at center,#fbf0d2 0%,#f4e4bc 60%,#e8d09a 100%);border:3px solid var(--outl);box-shadow:inset 0 0 0 3px #c9a26b,0 3px 0 rgba(0,0,0,.45);border-radius:4px;color:var(--ink)}
header{margin:8px 8px 6px;padding:6px 8px;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
header .cell{padding:4px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;border-radius:4px;background:rgba(42,22,10,.35);box-shadow:inset 0 0 0 2px rgba(255,210,140,.18)}
.guild{flex:1.4;flex-direction:row!important;align-items:center;gap:10px}
.guild canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
.guild .h{font-size:13px;color:var(--gold);text-shadow:2px 2px 0 #2a160a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-family:"PIX";font-size:8px;color:#ffe2a8;opacity:.9;white-space:nowrap}
.big{font-family:"PIX";font-size:15px;color:#fff;text-shadow:2px 2px 0 #2a160a;margin:3px 0 2px}
.sub{font-size:16px;color:#ffe9c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:#2a160a;border:2px solid #2a160a;border-radius:3px;margin:4px 0 2px;position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe680 0 40%,#f5b400 40%);transition:width 1.2s steps(24)}
.bar.green>i{background:linear-gradient(#a6f27c 0 40%,#4e9a36 40%)}
.stat{flex:.9;text-align:center;align-items:center}
.lvl{flex:1.3}.pallet{flex:1.5}
#soundBtn{cursor:pointer;font-family:"PIX";font-size:8px;background:#5c3416;color:#ffe2a8;border:3px solid var(--outl);box-shadow:inset 0 0 0 2px var(--woodhi);padding:8px;border-radius:4px}
main{flex:1;display:flex;gap:8px;padding:0 8px 8px;min-height:0}
#stageWrap{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
#stage{position:relative;line-height:0;padding:6px;border-radius:8px}
#scene{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid var(--outl);border-radius:3px;cursor:pointer;background:#5ec4ff}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;line-height:1;z-index:5}
.tag .nm{font-family:"PIX";font-weight:normal;font-size:7px;color:#fff;background:rgba(42,22,10,.78);padding:2px 3px 1px;border-radius:3px;display:inline-block;transition:opacity .2s}
.tag.talk{z-index:20}.tag.talk .nm{opacity:0}
.tag .bub{position:absolute;left:50%;bottom:0;background:#fffaf0;color:#2a160a;border:2px solid #2a160a;border-radius:6px;padding:3px 6px 2px;box-shadow:2px 2px 0 rgba(0,0,0,.35);white-space:normal;width:max-content;max-width:180px;text-align:center;
 opacity:0;visibility:hidden;transform:translate(calc(-50% + var(--sx,0px)),5px) scale(.94);transform-origin:50% 100%;transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.tag.talk .bub{opacity:1;visibility:visible;transform:translate(calc(-50% + var(--sx,0px)),0) scale(1);transition:opacity .22s ease,transform .22s ease,visibility 0s}
.tag .bub b{font-family:"PIX";font-weight:normal;font-size:7px;color:#c8323c;margin-right:4px}
.tag .bub .st{font-size:16px}
.tag .bub:after{content:"";position:absolute;left:calc(50% - var(--sx,0px));bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top-color:#2a160a}
.room{position:absolute;pointer-events:none;font-family:"PIX";font-size:7px;line-height:1;color:#ffe7b0;background:rgba(42,22,10,.7);padding:2px 3px 1px;border-radius:2px;white-space:nowrap;z-index:3}
.floaty{position:absolute;transform:translate(-50%,-100%);color:var(--gold);font-family:"PIX";font-size:12px;text-shadow:2px 2px 0 #2a160a;pointer-events:none;line-height:1;white-space:nowrap;z-index:30}
#dataLine{margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;color:#cfe8ff;font-size:17px}
.pill{font-family:"PIX";font-size:8px;padding:5px 8px;border:2px solid #2a160a;border-radius:10px;color:#fff;line-height:1.7;text-align:center}
.pill.live{background:#2f7a3a}.pill.snap{background:#9a6a12}.pill.load{background:#555}
aside{width:320px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding-bottom:4px}
aside>section{padding:8px 10px}
aside h2{margin:0 0 6px;font-family:"PIX";font-weight:normal;font-size:10px;color:#7a2e1a;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
aside h2 small{font-family:var(--ui);font-size:15px;color:#9a6a3a}
.commission{text-align:center}
.commission h2{justify-content:center;font-size:16px;letter-spacing:2px;color:#3b2410;margin-bottom:2px}
.commission .amt{font-family:"PIX";font-size:17px;color:#8b1a1a;margin:6px 0 4px}
.crew{display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px dashed #c9a26b;cursor:pointer}
.crew canvas{width:30px;height:40px;image-rendering:pixelated;flex:none;background:#e8d09a;border:2px solid #2a160a;border-radius:3px}
.crew .nm{font-family:"PIX";font-size:8px;color:#7a2e1a}
.crew .rl{font-size:14px;color:#9a6a3a}
.crew .s{font-size:16px}
.crew .ev{font-size:14px;color:#2f7a3a}
.q{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-bottom:1px dashed #c9a26b;font-size:17px}
.tg{font-family:"PIX";font-size:6px;padding:3px 3px 2px;border:2px solid #2a160a;border-radius:3px;flex:none;color:#fff;margin-top:1px}
.tg.todo{background:#7a7a8a}.tg.doing{background:#c98a00}.tg.done{background:#3c8a3a}
.seed{font-size:13px;color:#a0406a;border:1px solid #a0406a;border-radius:3px;padding:0 3px;margin-left:3px}
.who{color:#2f5f9a}
.ach{display:flex;flex-wrap:wrap;gap:4px}
.ach span{font-size:15px;padding:1px 5px;border:2px solid #2a160a;border-radius:3px;background:#d9c08a;opacity:.55}
.ach span.on{background:#ffd24a;opacity:1}
#panel{position:fixed;inset:0;background:rgba(6,16,30,.6);display:none;align-items:center;justify-content:center;z-index:1000}
#panel.show{display:flex}
#panel .card{width:min(400px,92vw);padding:14px}
#panel canvas{image-rendering:pixelated;float:left;margin:0 12px 6px 0;background:#e8d09a;border:3px solid #2a160a;border-radius:4px}
#panel h3{margin:4px 0 4px;font-family:"PIX";font-weight:normal;color:#7a2e1a;font-size:16px}
#panel .role{font-size:17px;color:#9a6a3a;margin-bottom:6px}
#panel .kv{clear:both;font-size:18px;margin-top:6px}
#panel .kv span{color:#7a2e1a}
#panel button{margin-top:10px;font-family:"PIX";font-size:9px;background:var(--red);color:#fff;border:3px solid #2a160a;padding:6px 12px;cursor:pointer;border-radius:4px}
#toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#toolbar button{min-height:44px}
#toolbar button,.btn{font-family:"PIX";font-size:8px;background:#5c3416;color:#ffe2a8;border:3px solid var(--outl);box-shadow:inset 0 0 0 2px var(--woodhi);padding:7px 9px;border-radius:4px;cursor:pointer}
#toolbar button:hover,.btn:hover{background:#7a4a22}
.btn.green{background:#2f7a3a;color:#fff}.btn.red{background:#c8323c;color:#fff}.btn.blue{background:#2f5f9a;color:#fff}.btn:disabled{opacity:.45;cursor:default}

.scroll:before,.scroll:after{content:"";position:absolute;left:-8px;right:-8px;height:6px;background:#8a5527;border:2px solid #2a160a;border-radius:4px}
.scroll:before{top:-6px}.scroll:after{bottom:-6px}
.scroll .meta{font-size:14px;color:#9a6a3a}
.scroll .res{color:#2f7a3a}
.jobform textarea,.jobform select,.jobform input{font-family:var(--ui);font-size:17px;width:100%;border:2px solid #2a160a;border-radius:3px;background:#fffaf0;color:#2a160a;padding:3px;margin:2px 0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}

.gamecv{width:100%;max-width:640px;aspect-ratio:16/9;image-rendering:pixelated;border:3px solid #2a160a;border-radius:4px;display:block;margin:0 auto;background:#123;cursor:crosshair}
.qopt{display:block;width:100%;text-align:left;margin:4px 0;font-family:var(--ui);font-size:18px;background:#fffaf0;border:2px solid #2a160a;border-radius:4px;padding:4px 8px;cursor:pointer}
